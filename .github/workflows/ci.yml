name: Check

on:
  pull_request:
    branches: [main]
    # labeled/unlabeled - чтобы метка i18n-skip сразу перезапускала проверку
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # нужно для lastUpdated
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint markdown
        run: npm run lint
      - name: Check translations
        run: node scripts/check-i18n.mjs
        env:
          I18N_BASE: ${{ github.event.pull_request.base.sha }}
          I18N_SKIP: ${{ contains(github.event.pull_request.labels.*.name, 'i18n-skip') && '1' || '0' }}
      - name: Build
        run: npm run docs:build
