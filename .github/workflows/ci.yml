name: Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # нужно для lastUpdated
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint markdown
        run: npx --yes markdownlint-cli2 "docs/index.md" "docs/posts/*.md"
      - name: Build
        run: npm run docs:build
